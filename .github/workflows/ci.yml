name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        xml-backend: ["stdlib", "lxml"]

    env:
      OPENPYXL_LXML: ${{ matrix.xml-backend == 'lxml' && 'True' || 'False' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - if: matrix.xml-backend == 'lxml'
        run: python -m pip install lxml
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the installed wheel
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -v
      - name: Test the installed source distribution
        run: |
          python -m pip install --force-reinstall dist/*.tar.gz
          python -m unittest discover -s tests -v
