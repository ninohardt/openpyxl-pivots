[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpyxl-pivots"
version = "0.2.0"
description = "Experimental native PivotTable creation for openpyxl"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["openpyxl>=3.1.5,<3.2"]
keywords = ["excel", "openpyxl", "ooxml", "pivot-table", "xlsx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/ninohardt/openpyxl-pivots"
Repository = "https://github.com/ninohardt/openpyxl-pivots.git"
Issues = "https://github.com/ninohardt/openpyxl-pivots/issues"
Changelog = "https://github.com/ninohardt/openpyxl-pivots/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
